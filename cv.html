<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV — José Manuel Atero</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink:   #111111;
      --paper: #ffffff;
      --muted: rgba(17,17,17,0.4);
      --nav-h: clamp(52px, 8vh, 72px);
      --ease:  cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      background: var(--paper);
      color: var(--ink);
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      padding: 0 clamp(20px, 4vw, 48px);
      opacity: 0;
      animation: fadeIn 0.8s var(--ease) 0.1s forwards;
    }

    .logo {
      font-family: 'DM Mono', monospace;
      font-weight: 400;
      font-size: clamp(0.82rem, 1.5vw, 1.05rem);
      letter-spacing: 0.18em;
      text-transform: lowercase;
      color: var(--ink);
      text-decoration: none;
    }

    main {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeUp 0.9s var(--ease) 0.3s forwards;
    }

    .page-label {
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      font-size: clamp(0.6rem, 1vw, 0.78rem);
      letter-spacing: 0.22em;
      text-transform: lowercase;
      color: var(--muted);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo" aria-label="Volver a la página principal">josemanuelatero</a>
  </header>

  <main>
    <span class="page-label">cv</span>
  </main>

</body>
</html>
