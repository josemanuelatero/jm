<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>josemanuelatero</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      background: #000; /* fallback mientras carga el vídeo */
    }
    /* Vídeo local a pantalla completa, sin franjas */
    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;      /* elimina barras negras (recorta para cubrir) */
      z-index: -1;
      pointer-events: none;   /* no bloquea clics */
      opacity: 0.35;          /* fondo sutil; cambia si quieres */
      background: #000;
    }
    h1, a {
      margin: 6px 0;
      text-decoration: none;
      color: white;
      transition: font-weight 0.2s;
      position: relative;
      z-index: 1;             /* letras sobre el vídeo */
    }
    a:hover, h1:hover { font-weight: bold; }
    @media (prefers-reduced-motion: reduce) {
      .bg-video { display: none; }
      body { background: #000; }
    }
  </style>
</head>
<body>
  <!-- Vídeo local en la misma carpeta -->
  <video class="bg-video" autoplay muted loop playsinline preload="metadata">
    <source src="Comp1.webm" type="video/mp4">
    Tu navegador no soporta el vídeo HTML5.
  </video>

  <h1>josemanuelatero</h1>
  <a href="cv.pdf" target="_blank">CV</a>
  <a href="carpeta.html" target="_blank">Carpeta</a>
</body>
</html>
