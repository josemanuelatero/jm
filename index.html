<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>josemanuelatero</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: white;
      font-family: Arial, sans-serif;
      color: black;
    }

    /* Vídeo cubre toda la pantalla */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
      pointer-events: none;
      opacity: 0.55;
    }

    /* Contenido centrado y elevado */
    .content {
      position: relative;
      top: -10vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
    }

    h1, a {
      margin: 6px 0;
      text-decoration: none;
      color: black;
      transition: font-weight 0.2s;
    }

    a:hover, h1:hover { font-weight: bold; }

    @media (prefers-reduced-motion: reduce) {
      .bg-video { display: none; }
      body { background: white; }
    }
  </style>
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="Comp1.webm" type="video/webm">
    Tu navegador no soporta el vídeo HTML5.
  </video>

  <div class="content">
    <h1>josemanuelatero</h1>
    <a href="cv.pdf" target="_blank">CV</a>
    <a href="carpeta.html" target="_blank">Carpeta</a>
  </div>
</body>
</html>
