<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>josemanuelatero</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: white;
      font-family: Arial, sans-serif;
      color: black;
    }

    /* Capa de vídeo: detrás pero visible */
    .video-layer {
      position: fixed;
      inset: 0;
      z-index: 0;              /* >=0 para evitar que quede detrás del root */
    }
    .video-layer video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      opacity: 0.55;
      pointer-events: none;
      background: white;
      display: block;
    }

    /* Contenido por encima del vídeo */
    .content {
      position: relative;
      z-index: 1;
      top: -10vh;              /* elevar ligeramente */
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    h1, a {
      margin: 6px 0;
      text-decoration: none;
      color: black;
      transition: font-weight 0.2s;
    }
    a:hover, h1:hover { font-weight: bold; }

    /* Si el usuario pide reducir movimiento, no ocultamos el vídeo por completo */
    @media (prefers-reduced-motion: reduce) {
      .video-layer video { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div class="video-layer">
    <video autoplay muted loop playsinline preload="auto" poster="">
      <source src="Comp1.webm" type="video/webm">
      <source src="Comp1.mp4" type="video/mp4">
      Tu navegador no soporta el vídeo HTML5.
    </video>
  </div>

  <div class="content">
    <h1>josemanuelatero</h1>
    <a href="cv.pdf" target="_blank">CV</a>
    <a href="carpeta.html" target="_blank">Carpeta</a>
  </div>
</body>
</html>
