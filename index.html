<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>José Manuel Atero — Arquitecto</title>
  <meta name="description" content="José Manuel Atero, arquitecto. Portfolio y curriculum.">
  <meta name="author" content="José Manuel Atero">

  <!-- Open Graph -->
  <meta property="og:title" content="José Manuel Atero — Arquitecto">
  <meta property="og:description" content="Portfolio y curriculum de José Manuel Atero, arquitecto.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://josemanuelatero.github.io">
  <!-- Sustituye og:image por una captura real de tu web o proyecto -->
  <meta property="og:image" content="og-preview.jpg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="José Manuel Atero — Arquitecto">
  <meta name="twitter:description" content="Portfolio y curriculum de José Manuel Atero, arquitecto.">

  <!-- Preload vídeo -->
  <link rel="preload" as="video" href="Comp1.webm" type="video/webm">

  <!-- Tipografía: Cormorant Garamond (display) + DM Mono (etiquetas) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink:   #111111;
      --paper: #ffffff;
      --muted: rgba(17,17,17,0.38);
      --gap:   clamp(6px, 1.2vh, 12px);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
    }

    /* ── Vídeo ─────────────────────────────────────────── */
    .video-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .video-layer video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.5;
      pointer-events: none;
      display: block;
    }

    @media (prefers-reduced-motion: reduce) {
      .video-layer video { opacity: 0.15; }
    }

    /* ── Layout central ────────────────────────────────── */
    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-bottom: 12vh; /* empuja el bloque hacia el tercio superior */
    }

    /* ── Nombre ────────────────────────────────────────── */
    .site-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.6rem, 5vw, 3rem);
      letter-spacing: 0.18em;
      text-transform: lowercase;
      margin: 0 0 clamp(20px, 4vh, 40px);
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
    }

    /* ── Separador ─────────────────────────────────────── */
    .divider {
      width: 1px;
      height: clamp(24px, 4vh, 48px);
      background: var(--muted);
      margin: 0 auto clamp(20px, 4vh, 40px);
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
    }

    /* ── Navegación ────────────────────────────────────── */
    nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--gap);
    }

    nav a {
      font-family: 'DM Mono', 'Courier New', monospace;
      font-weight: 400;
      font-size: clamp(0.62rem, 1.3vw, 0.78rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;

      /* Subrayado animado */
      background-image: linear-gradient(var(--ink), var(--ink));
      background-size: 0% 1px;
      background-repeat: no-repeat;
      background-position: left bottom;
      padding-bottom: 2px;
      transition: background-size 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.2s ease;

      opacity: 0;
    }

    nav a:nth-child(1) { animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards; }
    nav a:nth-child(2) { animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.65s forwards; }

    nav a:hover {
      background-size: 100% 1px;
    }

    /* ── Animación entrada ─────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="video-layer" aria-hidden="true">
    <!--
      poster: imagen estática que se muestra antes de que cargue el vídeo.
      Sustituye "poster.jpg" por una captura real de tu vídeo.
    -->
    <video
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      poster="poster.jpg"
    >
      <source src="Comp1.webm" type="video/webm">
      <source src="Comp1.mp4"  type="video/mp4">
    </video>
  </div>

  <main class="content">
    <h1 class="site-title">josemanuelatero</h1>

    <div class="divider" role="presentation"></div>

    <nav aria-label="Navegación principal">
      <a href="cv.pdf"         target="_blank" rel="noopener" aria-label="Descargar CV en PDF">CV</a>
      <a href="carpeta.html"   target="_blank" rel="noopener" aria-label="Ver carpeta de proyectos">Carpeta</a>
    </nav>
  </main>

</body>
</html>
