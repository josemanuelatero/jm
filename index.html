<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>josemanuelatero</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      background: #000; /* fallback */
    }

    /* Contenedor del vídeo: ocupa toda la pantalla y se desborda para evitar franjas */
    .video-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -1;
    }

    /* El truco: hacemos el iframe MUCHO más grande y lo centramos para cubrir sin barras */
    .video-bg iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 200vw;          /* suficientemente grande para cubrir incluso vídeos verticales */
      height: 200vh;
      transform: translate(-50%, -50%);
      border: 0;
      pointer-events: none;
      opacity: 0.35;         /* fondo sutil */
      background: transparent;
    }

    h1, a {
      margin: 6px 0;
      text-decoration: none;
      color: white;
      transition: font-weight 0.2s;
      position: relative;
      z-index: 1;
    }
    a:hover, h1:hover { font-weight: bold; }
  </style>
</head>
<body>
  <div class="video-bg">
    <iframe
      src="https://player.vimeo.com/video/1128759903?autoplay=1&loop=1&muted=1&background=1"
      allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      title="Comp 1">
    </iframe>
  </div>

  <h1>josemanuelatero</h1>
  <a href="cv.pdf" target="_blank">CV</a>
  <a href="carpeta.html" target="_blank">Carpeta</a>
</body>
</html>
