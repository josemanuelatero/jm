<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>josemanuelatero</title>
  <style>
    :root {
      --square-size: 20;
      --step: 20;
    }
    body {
      margin: 0;
      background: white;
      color: black;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .square {
      position: absolute;
      width: calc(var(--square-size) * 1px);
      height: calc(var(--square-size) * 1px);
      background: black;
    }

    h1, p {
      position: relative;
      z-index: 1;
      transition: font-weight 0.2s;
    }
    p:hover { font-weight: bold; }
  </style>
</head>
<body>
  <h1>josemanuelatero</h1>
  <p id="cvButton">CV</p>
  <p>Carpeta</p>

  <div id="square1" class="square"></div>
  <div id="square2" class="square"></div>

  <script>
    const colors = ['#000000', '#0047FF', '#8B0000'];
    const step = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--step'));
    const size = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--square-size'));

    function createSquare(el, startX, startY, dirX, dirY, colorIndex) {
      return {
        el: el,
        x: startX,
        y: startY,
        dirX: dirX,
        dirY: dirY,
        colorIndex: colorIndex
      };
    }

    // Cuadrado 1: izquierda → derecha, sube
    const square1 = createSquare(
      document.getElementById("square1"),
      0, Math.max(0, window.innerHeight - size), 1, -1, 0
    );

    // Cuadrado 2: derecha → izquierda, baja
    const square2 = createSquare(
      document.getElementById("square2"),
      Math.max(0, window.innerWidth - size), 0, -1, 1, 1
    );

    const squares = [square1, square2];

    function tick(square) {
      const maxX = Math.max(0, window.innerWidth - size);
      const maxY = Math.max(0, window.innerHeight - size);

      // Avanzar en X en pasos de 20px
      square.x += step * square.dirX;

      // Cambiar color en cada movimiento
      square.colorIndex = (square.colorIndex + 1) % colors.length;
      square.el.style.backgroundColor = colors[square.colorIndex];

      // Rebotar en laterales
      if (square.x <= 0 || square.x >= maxX) {
        square.x = square.x <= 0 ? 0 : maxX;
        square.dirX *= -1; // invierte sentido X

        // Mover 20px en Y (arriba o abajo según dirY)
        square.y += step * square.dirY;

        // Limitar a pantalla
        if (square.y < 0) square.y = 0;
        if (square.y > maxY) square.y = maxY;
      }

      // Aplicar posiciones
      square.el.style.left = square.x + "px";
      square.el.style.top  = square.y + "px";
    }

    // Posiciones y color inicial
    squares.forEach(sq => {
      sq.el.style.left = sq.x + "px";
      sq.el.style.top  = sq.y + "px";
      sq.el.style.backgroundColor = colors[sq.colorIndex];
    });

    // Animación: ambos cada 1s
    setInterval(() => {
      squares.forEach(sq => tick(sq));
    }, 1000);

    // Adaptar a resize
    window.addEventListener("resize", () => {
      const maxX = Math.max(0, window.innerWidth - size);
      const maxY = Math.max(0, window.innerHeight - size);
      squares.forEach(sq => {
        if (sq.x > maxX) sq.x = maxX;
        if (sq.y > maxY) sq.y = maxY;
        sq.el.style.left = sq.x + "px";
        sq.el.style.top  = sq.y + "px";
      });
    });
  </script>
</body>
</html>
