<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>josemanuelatero</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      background: white; /* Fondo blanco simple */
    }
    h1, p {
      position: relative;
      z-index: 1;
      margin: 6px 0;
      padding: 2px 6px;
      border-radius: 6px;
      transition: font-weight 0.2s;
    }
    p:hover { font-weight: bold; }
    h1:hover { font-weight: bold; }

    #bee {
      position: absolute;
      width: 40px;
      height: 40px;
      z-index: 2;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <h1>josemanuelatero</h1>
  <p id="cvButton">CV</p>
  <p>Carpeta</p>

  <img id="bee" src="bee.png" alt="bee">

  <script>
    const bee = document.getElementById("bee");

    let x = window.innerWidth / 2;
    let y = 100;
    let targetX = x;
    let targetY = y;

    function pickNewTarget() {
      targetX = Math.random() * window.innerWidth;
      targetY = Math.random() * (window.innerHeight / 2);
    }

    function animate() {
      // Movimiento continuo y suave
      x += (targetX - x) * 0.01;
      y += (targetY - y) * 0.01;

      bee.style.left = x + "px";
      bee.style.top = y + "px";

      if (Math.abs(targetX - x) < 1 && Math.abs(targetY - y) < 1) {
        pickNewTarget();
      }

      requestAnimationFrame(animate);
    }

    pickNewTarget();
    animate();

    window.addEventListener("resize", () => {
      if (y > window.innerHeight/2) y = window.innerHeight/2;
    });
  </script>
</body>
</html>
